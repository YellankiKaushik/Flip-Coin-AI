name: Local engine and evidence contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dependency-install:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-tested-tools
      - name: Run mandatory checks and preserve actual receipts
        run: npm run ci:proof -- dependency-install
      - name: Upload synthetic redacted receipts and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: switchforge-dependency-install-${{ github.run_id }}
          path: .local/ci/dependency-install/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  typecheck:
    runs-on: windows-latest
