name: Set up tested Windows tools
description: Locked npm dependencies, Chromium, and verified pinned oasdiff
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.16.0
    - name: Pinned npm
      shell: pwsh
      run: npm install --global npm@11.9.0
    - name: Locked dependencies
      shell: pwsh
      run: npm ci
    - name: Chromium
      shell: pwsh
      run: npx playwright install chromium
    - name: Pinned OpenAPI tool
      shell: pwsh
      run: ./scripts/install-oasdiff.ps1
