<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img"><title>SwitchForge human-gates</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35d3d0"/></marker></defs><rect width="100%" height="100%" fill="#08111f"/><text x="70" y="80" fill="#eef5ff" font-family="Segoe UI,Arial,sans-serif" font-size="44" font-weight="700">Three separate human decisions</text><rect x="70" y="150" width="1450" height="130" rx="18" fill="#101f32" stroke="#ffbd66" stroke-width="2"/><text x="94" y="195" fill="#ffbd66" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="650">CRITERIA_REVIEW</text><text x="94" y="233" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Review the requirements and the tests</text><rect x="70" y="325" width="1450" height="130" rx="18" fill="#101f32" stroke="#ffbd66" stroke-width="2"/><text x="94" y="370" fill="#ffbd66" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="650">PATCH_REVIEW</text><text x="94" y="408" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Review the proposed synthetic correction</text><rect x="70" y="500" width="1450" height="130" rx="18" fill="#101f32" stroke="#ffbd66" stroke-width="2"/><text x="94" y="545" fill="#ffbd66" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="650">RELEASE_READINESS</text><text x="94" y="583" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Review the corrected evidence and policy</text><text x="70" y="735" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">Level 1 manual attestation • recorded decision retained • effective state can expire</text></svg>