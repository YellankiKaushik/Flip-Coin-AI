<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img"><title>SwitchForge four-engines</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35d3d0"/></marker></defs><rect width="100%" height="100%" fill="#08111f"/><text x="70" y="80" fill="#eef5ff" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">Four checks. Four different engineering questions.</text><rect x="70" y="150" width="700" height="205" rx="18" fill="#101f32" stroke="#35d3d0" stroke-width="2"/><text x="94" y="195" fill="#35d3d0" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="650">AcceptanceRelay</text><text x="94" y="233" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Vitest</text><text x="94" y="293" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Does the coupon behave at the expiry boundary?</text><rect x="830" y="150" width="700" height="205" rx="18" fill="#101f32" stroke="#35d3d0" stroke-width="2"/><text x="854" y="195" fill="#35d3d0" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="650">A11yRelay</text><text x="854" y="233" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Playwright + axe</text><text x="854" y="293" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Does the checkout input have an accessible label?</text><rect x="70" y="420" width="700" height="205" rx="18" fill="#101f32" stroke="#35d3d0" stroke-width="2"/><text x="94" y="465" fill="#35d3d0" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="650">ContractGuardian</text><text x="94" y="503" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">oasdiff</text><text x="94" y="563" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Does the API retain the documented JSON response?</text><rect x="830" y="420" width="700" height="205" rx="18" fill="#101f32" stroke="#35d3d0" stroke-width="2"/><text x="854" y="465" fill="#35d3d0" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="650">DataRescue</text><text x="854" y="503" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">csv-parse + rules</text><text x="854" y="563" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Does the synthetic order match its ledger amount?</text></svg>