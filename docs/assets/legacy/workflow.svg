<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img"><title>SwitchForge workflow</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35d3d0"/></marker></defs><rect width="100%" height="100%" fill="#08111f"/><text x="70" y="80" fill="#eef5ff" font-family="Segoe UI,Arial,sans-serif" font-size="44" font-weight="700">The human–agent release workflow</text><text x="70" y="230" fill="#ffbd66" font-family="Segoe UI,Arial,sans-serif" font-size="70" font-weight="700">01</text><text x="70" y="300" fill="#eef5ff" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600">Review criteria</text><text x="70" y="347" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Human</text><path d="M280,290 L350,290" stroke="#35d3d0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="370" y="230" fill="#35d3d0" font-family="Segoe UI,Arial,sans-serif" font-size="70" font-weight="700">02</text><text x="370" y="300" fill="#eef5ff" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600">Run defective</text><text x="370" y="347" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Agent</text><path d="M580,290 L650,290" stroke="#35d3d0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="670" y="230" fill="#ffbd66" font-family="Segoe UI,Arial,sans-serif" font-size="70" font-weight="700">03</text><text x="670" y="300" fill="#eef5ff" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600">Review correction</text><text x="670" y="347" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Human</text><path d="M880,290 L950,290" stroke="#35d3d0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="970" y="230" fill="#35d3d0" font-family="Segoe UI,Arial,sans-serif" font-size="70" font-weight="700">04</text><text x="970" y="300" fill="#eef5ff" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600">Verify corrected</text><text x="970" y="347" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Agent</text><path d="M1180,290 L1250,290" stroke="#35d3d0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1270" y="230" fill="#ffbd66" font-family="Segoe UI,Arial,sans-serif" font-size="70" font-weight="700">05</text><text x="1270" y="300" fill="#eef5ff" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600">Review readiness</text><text x="1270" y="347" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Human</text><text x="70" y="490" fill="#35d3d0" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="600">Real room request  →  real CLI execution  →  same-room report</text><text x="70" y="590" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400">The corrected scenario follows its own human patch review.</text><text x="70" y="652" fill="#a5b9d0" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400">Readiness and final attestation are separate records.</text></svg>